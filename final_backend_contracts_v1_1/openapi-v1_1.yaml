openapi: 3.1.0
info:
  title: Innosuisse Proposal Assistant API
  version: 1.1.0
  description: Versioned REST contract for the Evaluation-Beta. Agents and tools are internal; the API exposes projects, structured application
    data, sources, runs, review and exports.
servers:
- url: http://localhost:8000
  description: Local evaluation beta
security:
- cookieAuth: []
tags:
- name: Auth
- name: Infrastructure
- name: Projects
- name: Partners
- name: Sources
- name: Research
- name: Runs
- name: Requirements
- name: Evidence
- name: Fields
- name: Review
- name: Exports
- name: Audit
- name: Usage
- name: ApplicationData
- name: Controls
x-lifecycle:
  active_contract: evaluation_beta
  future_contract: planned_not_implemented
  contract_status: ready_for_implementation
  active_scope: evaluation_beta
x-planned-endpoints:
- method: GET
  path: /api/v1/runs/{run_id}/events
  feature: SSE run progress
  lifecycle: post_beta
- method: GET/POST
  path: /api/v1/projects/{project_id}/comments
  feature: Comments
  lifecycle: post_beta
- method: GET/POST
  path: /api/v1/projects/{project_id}/action-items
  feature: Action items
  lifecycle: post_beta
- method: GET/POST
  path: /api/v1/projects/{project_id}/section-assignments
  feature: Section assignments
  lifecycle: post_beta
- method: POST
  path: /api/v1/projects/{project_id}/invitations
  feature: Invitations and guest roles
  lifecycle: post_beta
- method: GET
  path: /api/v1/auth/entra/start
  feature: Microsoft Entra OIDC
  lifecycle: post_beta
- method: POST
  path: /api/v1/projects/{project_id}/onedrive/import
  feature: OneDrive import
  lifecycle: post_beta
- method: POST
  path: /api/v1/exports/{export_id}/onedrive
  feature: OneDrive export
  lifecycle: post_beta
- method: GET/PATCH
  path: /api/v1/admin/model-routes
  feature: Model route administration
  lifecycle: post_beta
- method: POST
  path: /api/v1/webhooks/provider-events
  feature: Provider webhooks
  lifecycle: post_beta
- path: /api/v1/projects/{project_id}/deletion-requests
  method: POST
  feature: Policy-governed project purge
  lifecycle: post_beta_requires_retention_decision
