          type:
          - string
          - 'null'
        professional_evidence:
          type: array
          items:
            $ref: '#/components/schemas/ProfessionalEvidence'
        partner_role_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PartnerRoleSuggestion'
        identity_match_status:
          type: string
