components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: proposal_session
  parameters:
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Required on unsafe methods when using session cookie.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type:
          - string
          - 'null'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type:
          - string
          - 'null'
          format: uri-reference
        code:
          type: string
        correlation_id:
          type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retry_after_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
    User:
      type: object
      required:
      - user_id
      - name
      - email
      - effective_role
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        effective_role:
          type: string
          enum:
          - lead_admin
          - member
        display_label:
          type:
          - string
          - 'null'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SessionResponse:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
    Capabilities:
      type: object
      required:
      - api_version
      - polling_interval_seconds
      - supported_source_types
      - features
      properties:
        api_version:
          type: string
        polling_interval_seconds:
          type: integer
          minimum: 1
          maximum: 10
        max_upload_bytes:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Deployment-specific technical limit; null only if enforced upstream and documented.
        supported_source_types:
          type: array
          items:
            type: string
            enum:
            - pdf
            - docx
            - txt
            - url
        features:
          type: object
          additionalProperties:
            type: boolean
    DataClassification:
      type: object
      required:
      - sensitivity
      - origin
      - processing_mode
      - web_research_mode
      - nda_applies
      properties:
        sensitivity:
          type: string
          enum:
          - public
          - internal
          - confidential
        origin:
          type: string
          enum:
          - public_source
          - synthetic
          - anonymized
          - real_project
        processing_mode:
          type: string
          enum:
          - deterministic_only
          - cloud_assisted
          - local_only
        web_research_mode:
          type: string
          enum:
          - 'off'
          - validated_public
        nda_applies:
          type: boolean
    ProjectCreate:
      type: object
      required:
      - title
      - description
      - funding_instrument_profile_id
      - data_classification
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        innovation_field:
          type:
          - string
          - 'null'
        funding_instrument_profile_id:
          type: string
        data_classification:
          $ref: '#/components/schemas/DataClassification'
        budget_framework_chf:
          type:
          - number
          - 'null'
          minimum: 0
    ProjectPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        innovation_field:
          type:
          - string
          - 'null'
        budget_framework_chf:
          type:
          - number
          - 'null'
          minimum: 0
    Project:
      allOf:
      - $ref: '#/components/schemas/ProjectCreate'
      - type: object
        required:
        - project_id
        - workspace_id
        - status
        - created_at
        - updated_at
        properties:
          project_id:
            type: string
          workspace_id:
            type: string
          status:
            type: string
            enum:
            - draft
            - active
            - archived
          created_at:
            type: string
