status_definitions:
  active: Verified and intended for implementation.
  active_conditional: Verified but only applies under an explicit condition.
  active_specification: Captured from the portal UI and valid as a specification; implementation expression may still be pending.
  needs_verification: Must not be enforced until source or portal behaviour is verified.
  deprecated: Kept only for traceability and not used.
override_policy:
  warning: May be acknowledged or overridden with a HumanDecision and comment.
  hybrid: May be changed only through a HumanDecision with comment and evidence where applicable.
  hard_blocker: Cannot be cleared by a status click. Correct the underlying data or document a formally permitted exception approved by lead_admin.
  mathematical_or_factual_failure: Underlying data must be corrected; no manual status-only override.
