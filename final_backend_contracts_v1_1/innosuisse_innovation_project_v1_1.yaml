official_core_rules:
- rule_id: INNO.PARTNER.IMPLEMENTATION.MIN1_CH
  title: Mindestens ein Umsetzungspartner mit Schweiz-Bezug
  description: Mindestens ein Umsetzungspartner muss in der Schweiz wertschöpfend tätig sein; wenn ausländische Umsetzungspartner beteiligt sind,
    muss mindestens ein Umsetzungspartner seinen Sitz in der Schweiz haben.
  category: partner_eligibility
  execution_mode: deterministic_with_human_evidence
  severity: blocker
  applies_when:
    instrument_profile: innosuisse_innovation_project_with_implementation_partner
  required_inputs:
  - partners[].type
  - partners[].country
  - partners[].swiss_value_creation
  - partners[].uid_or_seat_evidence
  condition:
    type: exists
    entity: implementation_partner
    where:
      swiss_value_creation: true
  result_mapping:
    'true': passed
    'false': failed
    missing: needs_input
  human_review_required: true
  override_policy: documented_legal_exception_only
  affected_field_ids:
  - ORG.CP.IMPLEMENTATION_PARTNERS
  source_refs:
  - official_program_page_2026
  - official_execution_provisions_2024_art11
  status: active
  test_cases:
  - id: impl-ch-pass
    given:
      implementation_partners:
      - swiss_value_creation: true
    expect: passed
  - id: impl-ch-missing
    given:
      implementation_partners: []
    expect: failed
  - id: impl-ch-unknown
    given:
      implementation_partners:
      - swiss_value_creation: null
    expect: needs_input
  requirement_id: REQ.INNO.PARTNER.IMPLEMENTATION.MIN1_CH
- rule_id: INNO.PARTNER.RESEARCH.MIN1_CH_ELIGIBLE
  title: Mindestens ein beitragsberechtigter Schweizer Forschungspartner
  description: Das Projekt benötigt mindestens einen Forschungspartner aus einer beitragsberechtigten Schweizer Forschungsinstitution.
  category: partner_eligibility
  execution_mode: deterministic_with_human_evidence
  severity: blocker
  applies_when:
    instrument_profile: innosuisse_innovation_project_with_implementation_partner
  required_inputs:
  - partners[].type
  - partners[].country
  - partners[].research_eligibility_status
  condition:
    type: exists
    entity: research_partner
    where:
      country: CH
      research_eligibility_status: eligible
  result_mapping:
    'true': passed
    'false': failed
    missing: needs_input
  human_review_required: true
  override_policy: not_overridable_without_official_eligibility_evidence
  affected_field_ids:
  - ORG.CP.RESEARCH_PARTNERS
  source_refs:
  - official_program_page_2026
  - official_execution_provisions_2024_art10
  status: active
  test_cases:
  - id: research-ch-pass
    given:
      research_partners:
      - country: CH
        research_eligibility_status: eligible
    expect: passed
  - id: research-ch-missing
    given:
      research_partners: []
    expect: failed
  requirement_id: REQ.INNO.PARTNER.RESEARCH.MIN1_CH_ELIGIBLE
- rule_id: INNO.PARTNER.INDEPENDENCE.PERSONNEL
  title: Personelle Unabhängigkeit der Projektpartner
  description: Involvierte Personen auf Seiten eines Forschungspartners dürfen nicht gleichzeitig für einen Umsetzungspartner tätig sein, ausser
    bei den offiziell beschriebenen Ausnahmen.
  category: governance_independence
  execution_mode: hybrid
  severity: blocker
  applies_when:
    implementation_partner_count:
      gte: 1
  required_inputs:
  - independence.personnel_answers
  - independence.exception_evidence
  condition:
    type: human_reviewed_questionnaire
    allowed_exception_types:
    - written_time_limited_advisory
    - no_innosuisse_funded_compensation_on_research_side
  result_mapping:
    clear: passed
    potential_conflict: needs_input
    confirmed_conflict: failed
  human_review_required: true
  override_policy: documented_official_exception_only
  affected_field_ids:
  - ORG.INDEPENDENCE.PERSONNEL.EMPLOYEE_OVERLAP
  - ORG.INDEPENDENCE.PERSONNEL.BOARD_ROLE
  - ORG.INDEPENDENCE.PERSONNEL.OTHER_ROLE
  source_refs:
  - official_program_page_2026
  - official_execution_provisions_2024_art12
  status: active
  requirement_id: REQ.INNO.PARTNER.INDEPENDENCE.PERSONNEL
- rule_id: INNO.PARTNER.INDEPENDENCE.FINANCIAL_20
  title: Finanzielle Unabhängigkeit und 20-Prozent-Schwelle
  description: Eine Beteiligung oder finanzielle Unterstützung im Umfang von mindestens 20 Prozent gilt als relevantes wirtschaftliches Interesse
    und muss als Konflikt behandelt werden.
  category: governance_independence
  execution_mode: hybrid
  severity: blocker
  required_inputs:
  - independence.ownership_percent
  - independence.financial_support_percent
  - independence.comments
  condition:
    type: max_exclusive_percent
    fields:
    - ownership_percent
    - financial_support_percent
    threshold: 20
  result_mapping:
    below_threshold_and_confirmed: passed
    at_or_above_threshold: failed
    missing: needs_input
  human_review_required: true
  override_policy: not_overridable_without_formal_eligibility_resolution
  affected_field_ids:
  - ORG.INDEPENDENCE.FINANCIAL.EMPLOYEE_OWNERSHIP_CONFIRMATION
  - ORG.INDEPENDENCE.FINANCIAL.LEGAL_ENTITY_OWNERSHIP_CONFIRMATION
  - ORG.INDEPENDENCE.FINANCIAL.EXPLANATIONS_COMMENTS
  source_refs:
  - official_execution_provisions_2024_art12
  - portal_field_matrix_v2_ui_verified
  status: active
  requirement_id: REQ.INNO.PARTNER.INDEPENDENCE.FINANCIAL_20
- rule_id: INNO.BUDGET.IMPLEMENTATION_SHARE_40_60
  title: Umsetzungspartnerbeitrag 40–60 Prozent
  description: Die Beteiligung der Umsetzungspartner muss grundsätzlich 40–60 Prozent der direkten Gesamtprojektkosten exklusive Overhead betragen.
    Gesetzlich vorgesehene Abweichungen benötigen eine belegte Begründung und Human Review.
  category: budget
  execution_mode: deterministic_with_exception_review
  severity: blocker
  required_inputs:
  - budget.direct_total_project_costs_excluding_overhead
  - budget.implementation_own_contribution
  - budget.cash_contribution
  - budget.exception_basis
  condition:
    type: range_percent
    numerator: implementation_own_contribution + cash_contribution
    denominator: direct_total_project_costs_excluding_overhead
    min: 40
    max: 60
  result_mapping:
    in_range: passed
    out_of_range_without_exception: failed
    out_of_range_with_claimed_exception: needs_input
    missing: needs_input
  human_review_required: true
  override_policy: documented_legal_exception_only
  affected_field_ids:
  - PS.BUDGET_OVERVIEW.DISTRIBUTION
  - PS.BUDGET_OVERVIEW.CARDS
  source_refs:
  - official_program_page_2026
  - official_faq_2026
  - portal_field_matrix_v2_ui_verified
  status: active
  test_cases:
  - id: share-40-pass
    given:
      direct_total: 100000
      implementation_total: 40000
    expect: passed
  - id: share-60-pass
    given:
      direct_total: 100000
      implementation_total: 60000
    expect: passed
  - id: share-39-fail
    given:
      direct_total: 100000
      implementation_total: 39000
    expect: failed
  - id: share-missing
    given:
      direct_total: null
      implementation_total: 50000
    expect: needs_input
  requirement_id: REQ.INNO.BUDGET.IMPLEMENTATION_SHARE_40_60
- rule_id: INNO.BUDGET.CASH_MIN5
  title: Barbeitrag mindestens 5 Prozent
  description: Die finanzielle Leistung (Barbeitrag) an den Forschungspartner beträgt grundsätzlich mindestens 5 Prozent der direkten Gesamtprojektkosten
    exklusive Overhead.
  category: budget
  execution_mode: deterministic_with_exception_review
  severity: blocker
  required_inputs:
  - budget.direct_total_project_costs_excluding_overhead
  - budget.cash_contribution
  - budget.exception_basis
  condition:
    type: min_percent
    numerator: cash_contribution
    denominator: direct_total_project_costs_excluding_overhead
    min: 5
  result_mapping:
    at_or_above_min: passed
    below_without_exception: failed
    below_with_claimed_exception: needs_input
    missing: needs_input
  human_review_required: true
  override_policy: documented_legal_exception_only
  affected_field_ids:
  - PS.BUDGET_OVERVIEW.DISTRIBUTION
  - PS.BUDGET_OVERVIEW.CARDS
  source_refs:
  - official_program_page_2026
  - official_faq_2026
  - portal_field_matrix_v2_ui_verified
  status: active
  requirement_id: REQ.INNO.BUDGET.CASH_MIN5
- rule_id: INNO.BUDGET.NO_FINANCIAL_CAP
  title: Keine formale finanzielle Obergrenze
  description: Für Innovationsprojekte mit Umsetzungspartner besteht keine formale finanzielle Obergrenze; das Kosten-Nutzen-Verhältnis bleibt
    ein Evaluationskriterium.
  category: budget
  execution_mode: informational
  severity: info
  required_inputs:
  - budget.total_requested_funding
  condition:
    type: no_upper_threshold
  result_mapping:
    any_nonnegative_value: passed
  human_review_required: false
  override_policy: not_applicable
  affected_field_ids:
  - PS.BUDGET_OVERVIEW.FINANCIAL_OVERVIEW
  source_refs:
  - official_faq_2026
  status: active
  requirement_id: REQ.INNO.BUDGET.NO_FINANCIAL_CAP
- rule_id: INNO.DURATION.NO_FORMAL_MAX_WITH_IMPLEMENTATION_PARTNER
  title: Keine formale Höchstdauer mit Umsetzungspartner
  description: Für Innovationsprojekte mit Umsetzungspartner besteht keine formale maximale Projektdauer.
  category: duration
  execution_mode: informational
  severity: info
  applies_when:
    implementation_partner_count:
      gte: 1
  required_inputs:
  - project.duration_months
  condition:
    type: no_upper_threshold
  result_mapping:
    any_positive_value: passed
    missing: needs_input
  human_review_required: false
  override_policy: not_applicable
  affected_field_ids:
  - PS.PROJECT_PLAN.PROJECT_DATES
  source_refs:
  - official_faq_2026
  status: active
  requirement_id: REQ.INNO.DURATION.NO_FORMAL_MAX_WITH_IMPLEMENTATION_PARTNER
- rule_id: INNO.DURATION.TYPICAL_6_36
  title: Übliche Projektdauer 6–36 Monate
  description: Innovationsprojekte mit Umsetzungspartner dauern in der Regel 6 bis 36 Monate. Werte ausserhalb dieses Bereichs sind keine automatische
    formale Ablehnung, sondern ein Plausibilitätshinweis.
  category: duration
  execution_mode: deterministic_advisory
  severity: warning
  applies_when:
    implementation_partner_count:
      gte: 1
  required_inputs:
  - project.duration_months
  condition:
    type: advisory_range
    min: 6
    max: 36
  result_mapping:
    in_range: passed
    outside_range: warning
    missing: needs_input
  human_review_required: false
  override_policy: not_required_for_advisory
  affected_field_ids:
  - PS.PROJECT_PLAN.PROJECT_DATES
  source_refs:
  - official_faq_2026
  status: active
  requirement_id: REQ.INNO.DURATION.TYPICAL_6_36
- rule_id: INNO.DURATION.MAX18_WITHOUT_IMPLEMENTATION_PARTNER
  title: Höchstdauer 18 Monate ohne Umsetzungspartner
  description: Projekte ohne Umsetzungspartner dürfen grundsätzlich 18 Monate nicht überschreiten; diese Regel ist im Zielprofil mit Umsetzungspartner
    normalerweise nicht anwendbar.
  category: duration
  execution_mode: deterministic_with_exception_review
  severity: blocker
  applies_when:
    implementation_partner_count: 0
  required_inputs:
  - project.duration_months
  - project.duration_exception
  condition:
    type: max_value
    field: duration_months
    max: 18
  result_mapping:
    at_or_below_max: passed
    above_without_exception: failed
    above_with_claimed_exception: needs_input
  human_review_required: true
  override_policy: documented_official_exception_only
  affected_field_ids:
  - PS.PROJECT_PLAN.PROJECT_DATES
  source_refs:
  - official_faq_2026
  - official_execution_provisions_2024_art21
  status: active_conditional
  requirement_id: REQ.INNO.DURATION.MAX18_WITHOUT_IMPLEMENTATION_PARTNER
- rule_id: INNO.APPLICATION.COMPLETE_AND_TRACEABLE
  title: Gesuch vollständig und inhaltlich nachvollziehbar
  description: Das elektronische Gesuchsformular muss vollständig und inhaltlich nachvollziehbar ausgefüllt sein und alle Angaben enthalten, die
    für Beitragsberechtigung und Beitragshöhe notwendig sind.
  category: submission
  execution_mode: hybrid
  severity: blocker
  required_inputs:
  - portal_fields
  - requirement_assessments
  - open_issues
  condition:
    type: aggregate_submission_gate
    requires:
    - mandatory_fields_complete
    - no_open_blockers
    - required_budget_inputs_present
  result_mapping:
    complete: passed
    incomplete: failed
    unclear: needs_input
  human_review_required: true
  override_policy: no_override_for_missing_mandatory_data
  affected_field_ids:
  - SUM.REVIEW_APPLICATION.MANDATORY_FIELDS_CHECK
  - SUM.SUBMIT.COMPLETE_CORRECT_CONFIRMATION
  source_refs:
  - official_execution_provisions_2024_art2
  - portal_field_matrix_v2_ui_verified
  status: active
  requirement_id: REQ.INNO.APPLICATION.COMPLETE_AND_TRACEABLE
- rule_id: INNO.SCIENTIFIC_INTEGRITY.REVIEW
  title: Scientific-Integrity-Angabe verlangt Human Review
  description: Ein Hinweis auf eine schwere Sanktion wegen wissenschaftlicher Integrität muss kommentiert und zwingend menschlich geprüft werden;
    Projekte gegen wissenschaftliche Integrität oder gute wissenschaftliche Praxis werden nicht gefördert.
  category: scientific_integrity
  execution_mode: human_gate
  severity: blocker
  required_inputs:
  - scientific_integrity.sanction_answer
  - scientific_integrity.comment
  condition:
    type: conditional_human_gate
    when:
      sanction_answer: true
    requires:
    - comment
    - human_decision
  result_mapping:
    'no': passed
    yes_unreviewed: failed
    yes_reviewed: human_decision_required
  human_review_required: true
  override_policy: human_decision_only_no_automatic_clearance
  affected_field_ids:
  - SUM.SCIENTIFIC_INTEGRITY.SANCTION_QUESTION
  source_refs:
  - official_program_page_2026
  - portal_field_matrix_v2_ui_verified
  status: active
  requirement_id: REQ.INNO.SCIENTIFIC_INTEGRITY.REVIEW
