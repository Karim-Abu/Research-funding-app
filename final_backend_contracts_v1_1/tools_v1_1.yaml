  - internal
  allowed_processing_modes:
  - cloud_assisted
  side_effect: external_network_and_local_cache_write
  network_access: firecrawl_cloud_or_future_approved_fetcher
  authorization:
  - project_write_access
  - web_research_enabled
  limits:
    max_calls_per_run: 10
    max_pages_per_call: 1
    timeout_seconds: 60
    retry_count: 1
  required_controls:
  - CTRL.DATA_POLICY
  - CTRL.PUBLIC_URL_VALIDATION
  - CTRL.SSRF_PREVENTION
  - CTRL.REDIRECT_REVALIDATION
  - CTRL.INTERNAL_PUBLIC_QUERY_CONFIRMATION
  - CTRL.COST_GUARD
  - CTRL.PROMPT_INJECTION
  - CTRL.OUTPUT_SCHEMA
  - CTRL.AUDIT_WRITE
  audit_required: true
  usage_record_required: true
  failure_policy: return_open_issue_and_continue_without_web_source
