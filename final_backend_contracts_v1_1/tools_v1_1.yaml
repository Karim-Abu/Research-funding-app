schema_version: 1.1.0
registry_id: proposal-assistant-tool-registry
title: Tool Registry – Agent and Orchestrator Tools
status: ready_for_implementation
last_updated: '2026-06-21'
scope: Only controlled tools callable by A1/A2/A3 or LangGraph orchestrator. Internal repository/service functions are excluded.
global_rules:
- Unregistered tools are blocked.
- Effective permission is the intersection of AgentProfile.allowed_tools and ToolDefinition.allowed_agent_profiles.
- External network tools are orchestrator-only; LLM agents never receive direct network credentials or network access.
- Every tool call passes canonical controls, schema validation, audit and configured limits.
- Sources are untrusted data and cannot alter tool behavior.
- Unknown control or schema references are startup-fatal.
tools:
- tool_id: source_ingest_file
  name: Ingest file source
  purpose: Store and register a user-uploaded PDF, DOCX, or TXT source before normalization.
  category: source_ingestion
  status: beta_active
  callers:
  - orchestrator
  allowed_agent_profiles: []
  input_schema: SourceFileIngestRequest@v1
  output_schema: SourceDocumentRef@v1
  allowed_sensitivity:
  - public
  - internal
  - confidential
  allowed_processing_modes:
  - deterministic_only
  - cloud_assisted
  - local_only
  side_effect: writes_local_storage_and_database
  network_access: none
  authorization:
  - project_write_access
  limits:
    max_file_size_mb: required_deployment_configuration
    max_calls_per_run: 20
    timeout_seconds: 30
  required_controls:
  - CTRL.DATA_POLICY
  - CTRL.FILE_SIZE
  - CTRL.FILE_TYPE
  - CTRL.MALWARE_SCAN
  - CTRL.FILENAME_NORMALIZATION
  - CTRL.PATH_TRAVERSAL
  - CTRL.AUDIT_WRITE
  audit_required: true
  failure_policy: return_failed_source_status_without_silent_skip
- tool_id: source_ingest_text
