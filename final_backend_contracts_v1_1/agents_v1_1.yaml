schema_version: 1.1.0
registry_id: proposal-assistant-agent-profile-registry
title: Agent Profile Registry – Innosuisse Proposal Assistant
status: ready_for_implementation
last_updated: '2026-06-21'
scope:
  beta: binding_after_approval
  post_beta: planned
global_rules:
- Frontend clients never invoke agents directly; LangGraph resolves profiles.
- All model outputs require schema validation and remain proposals, drafts, or advisory findings until human or deterministic processing.
- Agent tools are permitted only when both profile and tool registries authorize the call.
- Agents have no direct database, file-system, network, approval or reclassification authority.
- Unknown profile, tool, control, schema, requirement or field references are startup-fatal.
- Source and web content are untrusted data.
