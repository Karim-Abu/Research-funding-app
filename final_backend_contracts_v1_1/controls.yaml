schema_version: 1.0.0
registry_id: controls.core
title: Control & Guardrail Registry
status: ready_for_implementation
last_updated: '2026-06-21'
global_rules:
- Unknown control IDs are startup-fatal.
- A blocked or failed pre-action control prevents the dependent action.
- Every control result is immutable, versioned and linked to the governed invocation or action.
- Warnings permit continuation only when the control definition and policy explicitly allow it.
- Source content is always untrusted data.
control_result_schema: ControlResultRecord@v1
controls:
- control_id: CTRL.DATA_POLICY
  version: 1.0.0
  name: Data policy routing
  category: privacy
  phase:
  - pre_source
  - pre_model
  - pre_tool
  - pre_export
  description: Resolves effective classification and permits, conditions, or blocks the requested processing route.
  statuses:
  - passed
  - warning
  - blocked
  - failed
  blocking_rule: blocked_or_failed_prevents_action
  reason_codes:
  - POLICY_ALLOWED
  - POLICY_CONFIRMATION_REQUIRED
  - POLICY_PROVIDER_NOT_APPROVED
  - POLICY_CONFIDENTIAL_BLOCKED
  - POLICY_NDA_BLOCKED
  - POLICY_CLASSIFICATION_MISSING
  audit_required: true
  test_cases_required:
  - happy_path
  - blocked_or_failed_path
