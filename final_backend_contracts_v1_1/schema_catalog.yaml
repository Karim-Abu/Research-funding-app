schema_version: 1.0.0
catalog_id: contracts.internal
title: Internal Agent and Tool Schema Catalog
status: ready_for_implementation
last_updated: '2026-06-21'
rules:
- Every schema reference in agents.yaml and tools.yaml must resolve to exactly one catalog entry.
- Fields marked required must be validated by Pydantic before invocation or persistence.
- Unknown fields are rejected unless a schema explicitly allows extensions.
- Domain record types referenced by fields map to canonical Pydantic domain views defined from Domain Model v4.
